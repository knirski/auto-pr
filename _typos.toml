# Spell check config (typos). Scope: markdown only.
# See docs/CI.md.

[files]
extend-exclude = ["*", "!**/*.md", "**/node_modules/**", "**/dist/**", "**/coverage/**"]

[default]
# Release-please changelog links embed 7-40 char commit SHAs; ignore them so
# hex substrings (e.g. "186ded6") are not reported as typos.
extend-ignore-re = ['\b[0-9a-f]{7,40}\b']

[default.extend-words]
# Project-specific and technical terms (allow as valid)
auto-pr = "auto-pr"
CycloneDX = "CycloneDX"
Biome = "Biome"
CODEOWNERS = "CODEOWNERS"
CodeQL = "CodeQL"
Codecov = "Codecov"
Covenant = "Covenant"
commitlint = "commitlint"
Effect = "Effect"
Liberapay = "Liberapay"
knirski = "knirski"
lychee = "lychee"
npmDepsHash = "npmDepsHash"
nixpkgs = "nixpkgs"
Ollama = "Ollama"
release-please = "release-please"
sbom = "sbom"
Scorecard = "Scorecard"
shellcheck = "shellcheck"
TypeScript = "TypeScript"
Vitest = "Vitest"
workflow = "workflow"
workflows = "workflows"
