# Codecov config. Suppresses "No config file could be found" warning.
# See https://docs.codecov.com/docs/codecov-yaml
#
# Coverage and JUnit uploads come from the check reusable workflow (.github/workflows/check.yml).
# Add codecov-action `flags` only if you split uploads (e.g. per-suite or per-OS).
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        target: 80%
        threshold: 2%
        if_ci_failed: error
comment:
  require_changes: true
ignore:
  - "dist/**"
  - "coverage/**"
