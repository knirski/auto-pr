name: Bug report
description: Report a bug to help us improve
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true

  - type: dropdown
    id: how-run
    attributes:
      label: How do you run auto-pr?
      options:
        - GitHub Actions workflow (reusable)
        - "npx -p github:knirski/auto-pr <command>"
        - Installed as dependency (npm/bun)
        - nix run
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: auto-pr version
      description: "Run `npx auto-pr-init --version` or check package.json"
      placeholder: "e.g. 0.1.2"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: "Run `node --version`"
      placeholder: "e.g. 20.0.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Ubuntu 24.04, macOS 15, GitHub-hosted runner"
    validations:
      required: true

  - type: textarea
    id: env-vars
    attributes:
      label: Environment variables (redact secrets)
      description: Relevant env vars. Replace secret values with `***`.
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant log output. Set `AUTO_PR_DEBUG=1` for verbose output.
      render: shell
