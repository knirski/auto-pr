# Composite action: stop llama-server started by llama-ci-local-server-start.
name: Stop local llama-server
description: Best-effort stop for llama-server pid from llama-ci-local-server-start

inputs:
  llama_ci_root:
    description: Same LLAMA_CI_ROOT as the start action
    required: true

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/llama-ci-local-server-stop.sh"
      env:
        LLAMA_CI_ROOT: ${{ inputs.llama_ci_root }}
