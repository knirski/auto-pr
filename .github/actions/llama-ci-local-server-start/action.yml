# Composite action: start llama.cpp llama-server for CI (OpenAI-compatible /v1).
name: Start local llama.cpp (llama-server)
description: Download optional binary/model and start llama-server on localhost

inputs:
  llama_release:
    description: ggml-org/llama.cpp release tag for prebuilt ubuntu-x64
    required: true
  model_url:
    description: HTTPS URL to a .gguf model file
    required: true
  llama_ci_root:
    description: Directory for cache (binary, model, pid, logs)
    required: true
  llama_port:
    description: >-
      TCP port for llama-server. Contract: OpenAI-compatible base URL is http://127.0.0.1:{this port}/v1
    required: false
    default: "8080"
  extra_flags:
    description: Extra flags appended to the llama-server command (e.g. "--jinja" for models requiring Jinja tool-call templates)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/llama-ci-local-server-start.sh"
      env:
        LLAMA_RELEASE: ${{ inputs.llama_release }}
        MODEL_URL: ${{ inputs.model_url }}
        LLAMA_CI_ROOT: ${{ inputs.llama_ci_root }}
        LLAMA_PORT: ${{ inputs.llama_port }}
        EXTRA_FLAGS: ${{ inputs.extra_flags }}
