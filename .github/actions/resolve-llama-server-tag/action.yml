# Composite: resolve Docker image ref + cache slug for local llama (auto-pr generate).
name: Resolve llama-server image tag
description: >-
  When the bundled local llama path is active: outputs image= and tag= (short cache slug, often digest prefix).
  Optional inputs.ai_llamacpp_release_tag overrides. Otherwise reads the image from the first FROM line in .github/llama-server/Dockerfile.
  Same gating as cache/start in auto-pr-generate-reusable.

inputs:
  always_resolve_tag:
    description: >-
      Advanced: if true, always resolve the tag (override or Dockerfile), skipping generate-job gating. Omit for
      standard auto-pr workflows (default false).
    required: false
    default: "false"
  commits_count:
    description: >-
      Semantic (non-merge) commit count for generate-job gating when always_resolve_tag is false. If empty, the
      action may derive the count from semantic_subjects.txt in the workspace.
    required: false
    default: ""
  ai_provider:
    required: false
    default: ""
  ai_llamacpp_model_url:
    required: false
    default: ""
  ai_openai_compat_url:
    required: false
    default: ""
  ai_llamacpp_release_tag:
    required: false
    default: ""

outputs:
  tag:
    description: >-
      Short cache slug (e.g. first 12 hex chars of digest). Empty when local llama is not needed.
    value: ${{ steps.resolve.outputs.tag }}
  image:
    description: >-
      Full Docker image reference for docker pull. Empty when local llama is not needed.
    value: ${{ steps.resolve.outputs.image }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/resolve-llama-server-tag.sh"
      env:
        ALWAYS_RESOLVE_TAG: ${{ inputs.always_resolve_tag }}
        COMMITS_COUNT: ${{ inputs.commits_count }}
        AI_PROVIDER: ${{ inputs.ai_provider }}
        AI_LLAMACPP_MODEL_URL: ${{ inputs.ai_llamacpp_model_url }}
        AI_OPENAI_COMPAT_URL: ${{ inputs.ai_openai_compat_url }}
        AI_LLAMACPP_RELEASE_TAG: ${{ inputs.ai_llamacpp_release_tag }}
