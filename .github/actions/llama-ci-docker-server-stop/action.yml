# Composite: stop llama-server container started by llama-ci-docker-server-start.
name: Stop local llama.cpp (Docker)
description: Best-effort docker rm for container from llama-ci-docker-server-start

runs:
  using: composite
  steps:
    - shell: bash
      run: bash "$GITHUB_ACTION_PATH/llama-ci-docker-server-stop.sh"
