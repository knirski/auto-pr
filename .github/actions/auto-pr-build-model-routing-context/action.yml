# JavaScript action: build AI model routing context for auto-pr generate.
name: Build model routing context
description: >-
  Collects diff signals, resolves a routing band, and emits prompt-ready routing context.
  Always emits a non-empty selected_model so generate-content keeps working for single-commit PRs.

inputs:
  workspace:
    description: Repository checkout path to run git commands against.
    required: true
  default_branch:
    description: Base branch name used for the PR range, e.g. main.
    required: true
  commits_count:
    description: Semantic (non-merge) commit count from the workflow preflight step.
    required: true
  ai_provider:
    required: true
  ai_openai_compat_model:
    description: Explicit model override; when empty, the action selects a provider default.
    required: false
    default: ""
  ai_openai_compat_url:
    description: External OpenAI-compatible URL. When set for local provider, GitHub-runner resource sizing is not used for model selection.
    required: false
    default: ""
  ai_llamacpp_model_url:
    description: HTTPS GGUF URL used by the bundled llama.cpp path, if any.
    required: false
    default: ""
  runner_label:
    description: GitHub runner label used to infer hosted-runner CPU/RAM when explicit resources are absent.
    required: false
    default: "ubuntu-24.04"
  repository_visibility:
    description: Repository visibility (public, private, or internal) used for GitHub-hosted runner sizing.
    required: false
    default: "private"
  local_runner_cpus:
    description: Optional explicit CPU count for local inference model selection.
    required: false
    default: ""
  local_runner_memory_gb:
    description: Optional explicit RAM in GB for local inference model selection.
    required: false
    default: ""

outputs:
  selected_model:
    description: Final model id to pass to generate-content.
  routing_context:
    description: Trusted routing context string for prompt conditioning.
  band:
    description: Model band selected by the heuristic.
  tool_strategy:
    description: Tool-use strategy for later AI prompt execution.
  reasoning_need:
    description: Reasoning level implied by the change signals.
  requires_tool_calls:
    description: Whether the selected model should support tool calls.
  local_runner_resources:
    description: Resolved local-runner resource profile used for local model selection.
  local_model_resource_fit:
    description: Whether the bundled GGUF URL appears to fit the resolved local-runner resources.
  local_model_recommendation:
    description: Local model recommendation for the resolved runner profile.

runs:
  using: node24
  main: auto-pr-build-model-routing-context.mjs
