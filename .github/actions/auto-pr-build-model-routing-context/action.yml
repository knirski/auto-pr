# Composite: build AI model routing context for auto-pr generate.
name: Build model routing context
description: >-
  Collects diff signals, resolves a routing band, and emits prompt-ready routing context.
  Always emits a non-empty selected_model so generate-content keeps working for single-commit PRs.

inputs:
  workspace:
    description: Repository checkout path to run git commands against.
    required: true
  default_branch:
    description: Base branch name used for the PR range, e.g. main.
    required: true
  commits_count:
    description: Semantic (non-merge) commit count from the workflow preflight step.
    required: true
  ai_provider:
    required: true
  ai_openai_compat_model:
    description: Explicit model override; when empty, the action selects a provider default.
    required: false
    default: ""

outputs:
  selected_model:
    description: Final model id to pass to generate-content.
    value: ${{ steps.build.outputs.selected_model }}
  routing_context:
    description: Trusted routing context string for prompt conditioning.
    value: ${{ steps.build.outputs.routing_context }}
  band:
    description: Model band selected by the heuristic.
    value: ${{ steps.build.outputs.band }}
  tool_strategy:
    description: Tool-use strategy for later AI prompt execution.
    value: ${{ steps.build.outputs.tool_strategy }}
  reasoning_need:
    description: Reasoning level implied by the change signals.
    value: ${{ steps.build.outputs.reasoning_need }}
  requires_tool_calls:
    description: Whether the selected model should support tool calls.
    value: ${{ steps.build.outputs.requires_tool_calls }}

runs:
  using: composite
  steps:
    - id: build
      shell: bash
      run: bun "$GITHUB_ACTION_PATH/auto-pr-build-model-routing-context.ts"
      env:
        WORKSPACE: ${{ inputs.workspace }}
        DEFAULT_BRANCH: ${{ inputs.default_branch }}
        COMMITS_COUNT: ${{ inputs.commits_count }}
        AI_PROVIDER: ${{ inputs.ai_provider }}
        INPUT_MODEL: ${{ inputs.ai_openai_compat_model }}
