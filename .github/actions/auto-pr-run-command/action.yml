# Composite action: run generate-content (workspace or npx/bunx package).
name: Run auto-pr command
description: Run generate-content via bun workspace or npx/bunx package

inputs:
  command:
    description: generate-content
    required: true
  use_workspace:
    description: "true to use bun run from workspace"
    required: true
  auto_pr_pkg:
    description: Package spec for npx/bunx -p
    required: true
  runner:
    description: npx or bunx (from setup-runtime)
    required: true

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/auto-pr-run-command.sh" "$AUTO_PR_COMMAND"
      env:
        AUTO_PR_COMMAND: ${{ inputs.command }}
        USE_WORKSPACE: ${{ inputs.use_workspace }}
        AUTO_PR_PKG: ${{ inputs.auto_pr_pkg }}
        RUNNER: ${{ inputs.runner }}
