# Composite action: set auto-pr package ref and use_workspace (npx vs workspace).
name: Set auto-pr package ref
description: Set package spec for npx/bun and whether to use workspace install

inputs:
  repository:
    description: GitHub repository (owner/name)
    required: true
  ref_name:
    description: Branch ref name (e.g. ai/feature)
    required: true

outputs:
  value:
    description: Package spec for npx (e.g. github:knirski/auto-pr#branch)
    value: ${{ steps.set.outputs.value }}
  use_workspace:
    description: "true when knirski/auto-pr same repo (bun install workspace)"
    value: ${{ steps.set.outputs.use_workspace }}

runs:
  using: composite
  steps:
    - id: set
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/auto-pr-set-pkg.sh"
      env:
        REPO: ${{ inputs.repository }}
        REF_NAME: ${{ inputs.ref_name }}
