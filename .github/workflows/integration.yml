# Real HTTP integration tests — three scenario-focused jobs run in parallel.
# Not published by auto-pr-init — knirski/auto-pr CI only; adopters do not copy this workflow.
# Called via workflow_call by ci.yml; workflow_dispatch for manual runs.
name: Integration

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-integration
  cancel-in-progress: true

permissions: {}

jobs:
  # Scenario: local model with no tool-call support → exercises the commit-summary fallback path.
  # Uses Mozilla tiny-llama (~27 KiB stub). Expected to fail AI generation; asserts graceful fallback.
  integration-local-fallback:
    permissions:
      contents: read
      models: read
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Load CI environment (.env.ci)
        uses: ./.github/actions/load-env-ci

      # Kernel-assigned ephemeral port (python3 socket bind — python3 ships on Ubuntu runners).
      - name: Llama port and OpenAI base URL (stub job)
        run: |
          port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          echo "INTEGRATION_LLAMA_PORT=$port" >> "$GITHUB_ENV"
          echo "AUTO_PR_AI_OPENAI_COMPAT_URL=http://127.0.0.1:${port}/v1" >> "$GITHUB_ENV"

      # always_resolve_tag: CI always starts llama here (no auto-pr generate NEED gate).
      - name: Resolve llama-server image tag
        id: llama_server_image
        uses: ./.github/actions/resolve-llama-server-tag
        with:
          always_resolve_tag: "true"

      - name: Setup runtime (Bun) with cache
        id: setup
        uses: ./.github/actions/setup-runtime

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stub model — cache key
        id: llama_stub_cache_key
        env:
          MODEL_URL: ${{ env.INTEGRATION_LLAMA_STUB_MODEL_URL }}
        run: |
          h=$(printf '%s' "$MODEL_URL" | sha256sum | awk '{print $1}')
          echo "hash=$h" >> "$GITHUB_OUTPUT"

      - name: Cache llama-server artifacts (stub GGUF + Docker image tar)
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          # Stable workspace path (not runner.temp): cache tars/GGUF for curl and `docker cp` into the llama container (no GGUF bind-mount).
          path: ${{ github.workspace }}/.cache/auto-pr-llama-stub
          key: llama-${{ steps.llama_server_image.outputs.tag }}-${{ steps.llama_stub_cache_key.outputs.hash }}-docker-stub

      - name: Start local llama-server (Docker)
        id: local_llama_stub
        uses: ./.github/actions/llama-server-docker-start
        with:
          docker_image: ${{ steps.llama_server_image.outputs.image }}
          model_url: ${{ env.INTEGRATION_LLAMA_STUB_MODEL_URL }}
          llama_server_root: ${{ github.workspace }}/.cache/auto-pr-llama-stub
          llama_port: ${{ env.INTEGRATION_LLAMA_PORT }}
          container_name: auto-pr-llama-stub

      - name: Resolve OpenAI model id from llama-server
        id: openai_model_stub
        run: |
          id=$(curl -fsS "$AUTO_PR_AI_OPENAI_COMPAT_URL/models" | jq -r '.data[0].id // empty')
          if [[ -z "$id" ]]; then
            echo "::error::Could not read model id from $AUTO_PR_AI_OPENAI_COMPAT_URL/models"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Run integration tests (local llama fallback path)
        env:
          AUTO_PR_AI_OPENAI_COMPAT_MODEL: ${{ steps.openai_model_stub.outputs.id }}
        run: bun --config=bunfig.integration.toml test test/integration/ai-providers.local-fallback.integration.test.ts

      - name: Stop local llama-server (Docker)
        if: always() && steps.local_llama_stub.outcome != 'skipped'
        uses: ./.github/actions/llama-server-docker-stop
        with:
          container_name: auto-pr-llama-stub

  # Scenario: cloud AI provider (GitHub Models) → exercises real AI generation, tool calls, JSON parse.
  # Uses phi-4-mini-instruct. No local model needed — lightweight job.
  integration-github-models:
    permissions:
      contents: read
      models: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Load CI environment (.env.ci)
        uses: ./.github/actions/load-env-ci
        with:
          omit_llama_integration_env: true

      - name: Setup runtime (Bun) with cache
        uses: ./.github/actions/setup-runtime

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run integration tests (GitHub Models)
        env:
          INTEGRATION_GITHUB_MODEL: ${{ env.INTEGRATION_GITHUB_MODEL }}
          GH_TOKEN: ${{ github.token }}
        run: bun --config=bunfig.integration.toml test test/integration/ai-providers.github-models.integration.test.ts

  # Scenario: local full model with tool-call support → exercises real AI generation without fallback.
  # Asserts AI output is used (no "AI description unavailable"). `--jinja` for chat-template tooling.
  integration-local-happy:
    permissions:
      contents: read
      models: read
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Load CI environment (.env.ci)
        uses: ./.github/actions/load-env-ci

      - name: Llama port and OpenAI base URL (full model job)
        run: |
          port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          echo "INTEGRATION_LLAMA_PORT=$port" >> "$GITHUB_ENV"
          echo "AUTO_PR_AI_OPENAI_COMPAT_URL=http://127.0.0.1:${port}/v1" >> "$GITHUB_ENV"

      - name: Resolve llama-server image tag
        id: llama_server_image
        uses: ./.github/actions/resolve-llama-server-tag
        with:
          always_resolve_tag: "true"

      - name: Setup runtime (Bun) with cache
        uses: ./.github/actions/setup-runtime

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Model — cache key
        id: llama_model_cache_key
        env:
          MODEL_URL: ${{ env.INTEGRATION_LLAMA_MODEL_URL }}
        run: |
          h=$(printf '%s' "$MODEL_URL" | sha256sum | awk '{print $1}')
          echo "hash=$h" >> "$GITHUB_OUTPUT"

      - name: Cache llama-server artifacts (model GGUF + Docker image tar)
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ github.workspace }}/.cache/auto-pr-llama-model
          key: llama-${{ steps.llama_server_image.outputs.tag }}-${{ steps.llama_model_cache_key.outputs.hash }}-docker-model

      - name: Start local llama-server (Docker)
        id: local_llama_model
        uses: ./.github/actions/llama-server-docker-start
        with:
          docker_image: ${{ steps.llama_server_image.outputs.image }}
          model_url: ${{ env.INTEGRATION_LLAMA_MODEL_URL }}
          llama_server_root: ${{ github.workspace }}/.cache/auto-pr-llama-model
          llama_port: ${{ env.INTEGRATION_LLAMA_PORT }}
          extra_flags: "--jinja"
          container_name: auto-pr-llama-model

      - name: Resolve OpenAI model id from llama-server
        id: openai_model
        run: |
          id=$(curl -fsS "$AUTO_PR_AI_OPENAI_COMPAT_URL/models" | jq -r '.data[0].id // empty')
          if [[ -z "$id" ]]; then
            echo "::error::Could not read model id from $AUTO_PR_AI_OPENAI_COMPAT_URL/models"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Run integration tests (local llama happy path)
        env:
          AUTO_PR_AI_OPENAI_COMPAT_MODEL: ${{ steps.openai_model.outputs.id }}
        run: bun --config=bunfig.integration.toml test test/integration/ai-providers.local-happy.integration.test.ts

      - name: Stop local llama-server (Docker)
        if: always() && steps.local_llama_model.outcome != 'skipped'
        uses: ./.github/actions/llama-server-docker-stop
        with:
          container_name: auto-pr-llama-model
