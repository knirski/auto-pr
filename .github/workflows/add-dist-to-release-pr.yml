# Adds dist/ to release-please PRs before merge so the tagged release commit includes it.
# Fixes: npx -p github:knirski/auto-pr#v0.1.2 would otherwise get a commit without dist.
# Runs when a release-please PR touches .release-please-manifest.json (opened or updated).
# Do not add package.json or CHANGELOG.md here: those fire for ordinary PRs and would push
# chore: update dist to feature branches, fighting the "no dist in PRs" policy.
# Branch guard: job only runs when head ref starts with 'release-please--' so that formatting
# PRs that touch .release-please-manifest.json do not trigger a dist commit.
# Loop prevention: only pushes when dist changes; re-run finds no diff.
#
# Token (Task 1.6b): this job uses the default GITHUB_TOKEN (the job already has job-level
# `contents: write`), NOT a GitHub App token. It therefore consumes no App secret and needs no
# protected `environment:`. This is a deliberate correction of Task 1.6's environment gate: because
# this workflow is only ever pull_request-triggered, GITHUB_REF is always refs/pull/<n>/merge, which
# the `app-credentials` environment's main-only deployment-branch policy never admits — an
# App-token/`environment:` design here would fail the ENTIRE job on 100% of runs (the environment
# gate is evaluated at job start, before any step). The only thing the App token bought was that its
# push would retrigger a fresh check run on the release-please PR (GITHUB_TOKEN-authored pushes do
# NOT trigger workflows). That is a minor operational nicety, acceptable to lose here: dist is
# machine-generated from already-reviewed source, and dropping the App token removes an entire
# App-secret consumer from the inventory (a net security simplification — fewer things touch the App
# credentials). See docs/adr/0016 decision 8 and .superpowers/sdd/task-1.6b-report.md.

name: Add dist to release PR

on:
  pull_request:
    branches:
      - main
    paths:
      - ".release-please-manifest.json"

concurrency:
  group: add-dist-to-release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  add-dist:
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-please--')
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Build and commit dist
        uses: ./.github/actions/build-and-commit-dist
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ github.token }}
          fetch_depth: "1"
          push_branch: ${{ github.event.pull_request.head.ref }}
