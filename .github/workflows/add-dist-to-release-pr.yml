# Adds dist/ to release-please PRs before merge so the tagged release commit includes it.
# Fixes: npx -p github:knirski/auto-pr#v0.1.2 would otherwise get a commit without dist.
# Runs when a release-please PR touches .release-please-manifest.json (opened or updated).
# Do not add package.json or CHANGELOG.md here: those fire for ordinary PRs and would push
# chore: update dist to feature branches, fighting the "no dist in PRs" policy.
# Branch guard: job only runs when head ref starts with 'release-please--' so that formatting
# PRs that touch .release-please-manifest.json do not trigger a dist commit.
# Loop prevention: only pushes when dist changes; re-run finds no diff.

name: Add dist to release PR

on:
  pull_request:
    branches:
      - main
    paths:
      - ".release-please-manifest.json"

concurrency:
  group: add-dist-to-release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  add-dist:
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-please--')
    permissions:
      contents: write
      pull-requests: read
    # Protected environment (ADR 0016 decision 8): APP_ID/APP_PRIVATE_KEY resolve from the
    # `app-credentials` environment, whose deployment-branch policy admits only the default branch
    # (main) with admin-bypass disabled, so the App secret is unreachable from any non-default ref.
    # NOTE: this job is pull_request-triggered, so GITHUB_REF is refs/pull/<n>/merge, which the
    # main-only policy does NOT admit — the job will fail closed on the environment gate. Reworking
    # this release-tooling credential path to run against a permitted ref is out of scope here (add
    # the `environment:` gate only, per Task 1.6); see the Task 1.6 report for the flagged follow-up.
    # Repository-level APP_ID/APP_PRIVATE_KEY are intentionally left in place until verified.
    environment: app-credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Build and commit dist
        uses: ./.github/actions/build-and-commit-dist
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch_depth: "1"
          push_branch: ${{ github.event.pull_request.head.ref }}
