# Reusable workflow for website-only PRs.
# Astro build (same as deploy-pages build step). Reports "check / check" for branch protection.
# See docs/CI.md.

name: Check

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-check-website
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: website

      - name: Build website
        run: bun run build
        working-directory: website
