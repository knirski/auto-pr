# Complementary to ci.yml: runs when only *.md changes.
# Calls check-docs.yml so both report "check / check" for branch protection.
# See docs/CI.md.

name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.md'

permissions: {}

concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
    # timeout-minutes not settable on reusable-call jobs; check-docs.yml caps check at 15m
    uses: ./.github/workflows/check-docs.yml
