# Reusable: Docker + Testcontainers (llama.cpp) + GitHub Models smoke tests.
# Used by check.yml and ci-workflows.yml. Fork PRs: GitHub Models may behave differently
# than same-repo PRs; if integration fails only on forks, re-run after merge or from a branch in the repo.

name: Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      models: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup runtime (Node or alternative) with cache
        uses: knirski/auto-pr/.github/actions/setup-runtime@84b2d2400a06a30bdf42a732a747ed9d19726491

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Integration tests (llama.cpp Testcontainers + GitHub Models)
        env:
          AUTO_PR_INTEGRATION_LOCAL: "1"
          AUTO_PR_INTEGRATION_GITHUB_MODELS: "1"
          # App reads GH_TOKEN everywhere (not GITHUB_TOKEN); map Actions token here.
          GH_TOKEN: ${{ github.token }}
        run: bun run test:integration
