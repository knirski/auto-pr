# Updates self-referential workflow pins (knirski/auto-pr/...@SHA) to current commit.
# Runs on push to main when workflows/actions change, or on workflow_dispatch.
# Loop prevention: skips when commit message matches the pin-updater prefix AND author is github-actions[bot].
# Only runs in knirski/auto-pr (skips forks).

name: Update workflow pins

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:

concurrency:
  group: update-workflow-pins-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-pins:
    # Loop prevention requires BOTH conditions to skip:
    #   - commit message starts with the pin-updater prefix, AND
    #   - head_commit.author.name is github-actions[bot] (git config in Commit-and-push; NOT github.actor,
    #     which would be the GitHub App slug when pushing with the App token).
    # A human commit that happens to reuse the prefix still runs.
    if: |
      github.repository == 'knirski/auto-pr' &&
      (github.event_name != 'push' ||
       github.event.head_commit == null ||
       !startsWith(github.event.head_commit.message, 'chore(workflows): update self-referential pins') ||
       github.event.head_commit.author.name != 'github-actions[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1

      - name: Update pins
        id: update
        uses: ./.github/actions/update-workflow-pins
        with:
          target_sha: ${{ github.sha }}

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add .github/
          git commit -m "chore(workflows): update self-referential pins to ${{ github.sha }}"
          git push origin HEAD:main
