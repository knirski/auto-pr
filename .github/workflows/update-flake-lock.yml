# Periodically updates flake.lock and opens a PR.
# See: https://github.com/DeterminateSystems/update-flake-lock

name: Update flake.lock

concurrency:
  group: update-flake-lock
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at 00:00 UTC

permissions: {}

jobs:
  update-flake-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Nix with cache
        uses: ./.github/actions/setup-nix-with-cache

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          pr-title: "chore(nix): update flake.lock"
          pr-labels: "dependencies,nix,automated"
          commit-msg: "chore(nix): update flake.lock"
