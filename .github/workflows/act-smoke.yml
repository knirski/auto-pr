# Smoke-test nektos/act: dry-run the ci.yml → check graph, and run the check-workflows job (ci-workflows.yml → check-workflows.yml).
# Matrix runs both in parallel (prep is cheap vs act). Does not replace GitHub-hosted CI.

name: Act smoke

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/act-local-ci.ts'
      - 'flake.nix'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/act-local-ci.ts'
      - 'flake.nix'
  workflow_dispatch:

concurrency:
  group: act-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Dry run (ci.yml check graph)
            act_command: bun scripts/act-local-ci.ts --dry-run check
            # --dryrun skips step execution; container only needs to start up, so a minimal image suffices.
            act_runner_image: ubuntu:24.04
          - label: Run act (check-workflows job)
            act_command: bun scripts/act-local-ci.ts check-workflows
            act_runner_image: ghcr.io/catthehacker/ubuntu:act-24.04
    env:
      # gh requires this in Actions; see https://docs.github.com/en/actions/using-workflows/using-github-cli-in-workflows
      GH_TOKEN: ${{ github.token }}
      # ACT_RUNNER_IMAGE is read by act-local-ci.ts (resolveActLocalCiRunnerFromProcessEnv), so it propagates
      # to both caching and the act run. Each matrix entry sets its own image via act_runner_image.
      ACT_RUNNER_IMAGE: ${{ matrix.act_runner_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # https://github.com/nektos/gh-act — bundles an act release; act-local-ci uses `gh act` when `act` is not on PATH.
      - name: Install act (gh extension)
        run: |
          gh extension install nektos/gh-act
          gh act --version

      # Derive cache path/key from ACT_RUNNER_IMAGE so the image name is the only value to update.
      # slug: strips registry+namespace, replaces ":" → "-" (e.g. "ubuntu:act-24.04" → "ubuntu-act-24.04").
      - name: Set image cache params
        id: image-params
        run: |
          slug="${ACT_RUNNER_IMAGE##*/}"
          slug="${slug//:/-}"
          echo "cache-path=/tmp/act-image-cache/${slug}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "cache-key=act-image-${{ runner.os }}-${slug}-v1" >> "$GITHUB_OUTPUT"

      # Cache the runner image so subsequent runs skip the ~1.5 GB pull.
      - name: Restore runner image cache
        id: image-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.image-params.outputs.cache-path }}
          key: ${{ steps.image-params.outputs.cache-key }}

      - name: Load cached runner image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load < "${{ steps.image-params.outputs.cache-path }}"

      - name: Pull and cache runner image
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          docker pull "$ACT_RUNNER_IMAGE"
          mkdir -p "$(dirname "${{ steps.image-params.outputs.cache-path }}")"
          docker save "$ACT_RUNNER_IMAGE" | gzip > "${{ steps.image-params.outputs.cache-path }}"

      # Cache actions downloaded by act (composite actions, etc.) across runs.
      - name: Cache act action store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/act
          key: act-actions-${{ runner.os }}-${{ hashFiles('.github/workflows/**') }}
          restore-keys: act-actions-${{ runner.os }}-

      - name: Run act
        run: ${{ matrix.act_command }}
