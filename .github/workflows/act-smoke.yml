# Smoke-test nektos/act: dry-run the ci.yml → check graph, and run the check-workflows job (ci-workflows.yml → check-workflows.yml).
# Matrix runs both in parallel (prep is cheap vs act). Does not replace GitHub-hosted CI.

name: Act smoke

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/act-local-ci.ts'
      - 'flake.nix'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/act-local-ci.ts'
      - 'flake.nix'
  workflow_dispatch:

concurrency:
  group: act-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Dry run (ci.yml check graph)
            act_command: bun scripts/act-local-ci.ts --dry-run check
          - label: Run act (check-workflows job)
            act_command: bun scripts/act-local-ci.ts check-workflows
    env:
      # gh requires this in Actions; see https://docs.github.com/en/actions/using-workflows/using-github-cli-in-workflows
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # https://github.com/nektos/gh-act — bundles an act release; act-local-ci uses `gh act` when `act` is not on PATH.
      - name: Install act (gh extension)
        run: |
          gh extension install nektos/gh-act
          gh act --version

      # Both matrix entries resolve to act-24.04 (GITHUB_ACTIONS=true + dryRun or check-workflows mode).
      # Cache the image so subsequent runs skip the ~1.5 GB pull.
      - name: Restore runner image cache
        id: image-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/act-image-cache/ubuntu-act-24.04.tar.gz
          key: act-image-${{ runner.os }}-ubuntu-act-24.04-v1

      - name: Load cached runner image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load < /tmp/act-image-cache/ubuntu-act-24.04.tar.gz

      - name: Pull and cache runner image
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          docker pull ghcr.io/catthehacker/ubuntu:act-24.04
          mkdir -p /tmp/act-image-cache
          docker save ghcr.io/catthehacker/ubuntu:act-24.04 | gzip > /tmp/act-image-cache/ubuntu-act-24.04.tar.gz

      # Cache actions downloaded by act (composite actions, etc.) across runs.
      - name: Cache act action store
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/act
          key: act-actions-${{ runner.os }}-${{ hashFiles('.github/workflows/**') }}
          restore-keys: act-actions-${{ runner.os }}-

      - name: Run act
        run: ${{ matrix.act_command }}
