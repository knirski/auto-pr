# Smoke-test nektos/act against the lightweight check-workflows job (ci-workflows.yml → check-workflows.yml).
# Does not replace GitHub-hosted CI; validates act + Docker + reusable workflow wiring on pushes/PRs that touch act-related files.

name: Act smoke

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/act-local-ci.ts'
      - 'flake.nix'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/act-local-ci.ts'
      - 'flake.nix'
  workflow_dispatch:

concurrency:
  group: act-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # gh requires this in Actions; see https://docs.github.com/en/actions/using-workflows/using-github-cli-in-workflows
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # https://github.com/nektos/gh-act — bundles an act release; act-local-ci uses `gh act` when `act` is not on PATH.
      - name: Install act (gh extension)
        run: |
          gh extension install nektos/gh-act
          gh act --version

      - name: Dry run act (validate workflow graphs)
        run: |
          bun scripts/act-local-ci.ts --dry-run check-workflows
          bun scripts/act-local-ci.ts --dry-run check

      - name: Run act (check-workflows job)
        run: bun scripts/act-local-ci.ts check-workflows
