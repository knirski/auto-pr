# Updates bun.nix. Manual fix when main is stale.
# ci.yml → nix job handles updates on push and PR when nix/deps paths match.
# Reuses the nix workflow (same-repo, push allowed).

name: Update bun.nix

on:
  workflow_dispatch:

concurrency:
  group: update-bun-nix
  cancel-in-progress: true

permissions: {}

jobs:
  update-bun-nix:
    permissions:
      contents: write
    # timeout-minutes not settable on reusable-call jobs; nix.yml caps bun-nix/build internally
    uses: ./.github/workflows/nix.yml
    secrets: inherit
