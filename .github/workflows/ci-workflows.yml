# Complementary to ci.yml: runs when only .github/** changes.
# Minimal check: verify self-referential knirski/auto-pr pins, actionlint, shellcheck, shfmt on .github/actions.
# See docs/CI.md.

name: CI

on:
  push:
    branches:
      - main
    paths:
      - '.github/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-workflows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
    # timeout-minutes not settable on reusable-call jobs; check-workflows.yml caps check at 5m
    uses: ./.github/workflows/check-workflows.yml
