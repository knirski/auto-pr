# Reusable workflow for docs-only PRs.
# Runs rumdl (markdown lint), lychee (link check), typos (spell check).
# No dependency install — all tools run via GitHub Actions.
# Reports "check / check" so branch protection allows merge.
# See docs/CI.md.

name: Check

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-check-docs
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Markdown lint
        uses: rvben/rumdl@023027472dbcb502aeb89760f4122e2235d36490 # v0.2.58

      - name: Check links
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/lychee-with-link-cache
        with:
          args: --timeout 90 --max-retries 10 --retry-wait-time 2 --no-progress --accept 200,429 .

      - name: Spell check
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0
