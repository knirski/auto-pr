# Reusable workflow for docs-only PRs.
# Runs rumdl (markdown lint), lychee (link check), typos (spell check).
# No dependency install — all tools run via GitHub Actions.
# Reports "check / check" so branch protection allows merge.
# See docs/CI.md.

name: Check

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-check-docs
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Markdown lint
        uses: rvben/rumdl@84dc9447eb9509aa5d031cc98d45dd170aa47744 # v0.2.8

      - name: Check links
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/lychee-with-link-cache
        with:
          args: --timeout 90 --max-retries 10 --retry-wait-time 2 --no-progress --accept 200,429 .

      - name: Spell check
        uses: crate-ci/typos@37bb98842b0d8c4ffebdb75301a13db0267cef89 # v1.47.2
