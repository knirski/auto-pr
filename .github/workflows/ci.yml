# CI: one entry workflow, path-filtered fan-out to per-domain jobs, single gate for branch protection.
# Replaces six pre-Area-A entry workflows (ci.yml + ci-docs + ci-website + ci-workflows + ci-release-please + ci-nix).
# See docs/CI.md §Branch Protection and docs/superpowers/specs/2026-04-19-ci-modernization-audit-design.md §2.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # false: superseding pushes no longer cancel in-flight runs. Cancelled runs surface as failed/bad
  # checks on PRs and confuse branch protection; true saves minutes but hurts UX on active branches.
  cancel-in-progress: false

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Determine which groups of files changed, so work jobs only run when relevant.
  # Filter definitions mirror the pre-Area-A entry workflows' paths / paths-ignore exactly.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter reads PR file list via REST
    outputs:
      code: ${{ steps.code_filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      website: ${{ steps.filter.outputs.website }}
      workflows: ${{ steps.filter.outputs.workflows }}
      nix: ${{ steps.filter.outputs.nix }}
      release_manifest: ${{ steps.filter.outputs.release_manifest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute code path filter
        id: code_filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          # `every` is required for the `code` filter because it uses a broad include (`**`)
          # plus excludes. With `some`, docs-only changes also match `code`.
          # Keep pure Nix file changes out of `code` so flake.lock and *.nix edits
          # only fan out to the dedicated nix workflow.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!*.md'
              - '!.github/**'
              - '!website/**'
              - '!**/*.nix'
              - '!flake.lock'
      - name: Compute path filters
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            docs:
              - '**/*.md'
            website:
              - 'website/**'
            workflows:
              - '.github/**'
            nix:
              - '**/*.nix'
              - 'package*.json'
              - 'bun.lock'
              - 'flake.lock'
            release_manifest:
              - '.release-please-manifest.json'

  # Dependency review (PRs only; skipped for Dependabot Bun PRs because GitHub's
  # dependency graph may not support bun.lock yet — bun audit in `check` covers those).
  dependency-review:
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      !(github.actor == 'dependabot[bot]' && startsWith(github.event.pull_request.head.ref, 'dependabot/bun-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4

  # Full check pipeline: lint, typecheck, unit tests, secret scan, workflow pin verify.
  # Runs for code changes and for release-please PRs (when `release_manifest` or `code` paths match).
  check:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.release_manifest == 'true'
    permissions:
      contents: read
      models: read
    uses: ./.github/workflows/check.yml
    secrets: inherit

  # Real-HTTP integration scenarios against a local llama-server. Code changes only.
  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      models: read
    uses: ./.github/workflows/integration.yml

  # Markdown lint + link check + spell check. Docs-only path.
  docs-lint:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/check-docs.yml

  # Astro build. Website-only path. (Mixed PRs touching code+website run both `check` and `website`.)
  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/check-website.yml

  # actionlint + shellcheck + shfmt + self-referential pin verify. .github-only path.
  workflows-lint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/check-workflows.yml

  # Nix flake build matrix + bun.nix regeneration.
  # ref targets the PR head commit on pull_request (else the pushed ref).
  # push_allowed (Task 1.6b): true ONLY for non-pull_request triggers (push to main,
  # workflow_dispatch). It is now false for EVERY pull_request — same-repo included, not just forks.
  # This is the root-cause fix for the Task 1.6 environment-gate regression: the privileged
  # bun-nix-push job (environment: app-credentials, main-only policy) must never even be attempted on
  # a pull_request (GITHUB_REF = refs/pull/<n>/merge, which the policy rejects → whole-job failure).
  # With push_allowed=false on PRs, bun-nix-push's `if:` is always false there, so it is cleanly
  # SKIPPED (which satisfies gate's "success or skipped"), never failed. Deliberate behavior change:
  # a same-repo PR with a stale bun.nix is no longer auto-fixed-and-pushed by CI; bun-nix-check fails
  # with a diagnostic telling the contributor to regenerate bun.nix locally. See nix.yml's header and
  # .superpowers/sdd/task-1.6b-report.md.
  nix:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/nix.yml
    with:
      ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      push_allowed: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  # Required status check for branch protection.
  # Fails only if any needed job's result is not success or skipped.
  # `if: always()` ensures the gate runs even when a needed job failed or was cancelled.
  gate:
    needs: [dependency-review, check, integration, docs-lint, website, workflows-lint, nix]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify required checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # jq -e exits non-zero on false; we capture it to produce a readable error.
          if ! echo "$NEEDS_JSON" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null; then
            echo "::error::One or more required jobs failed or were cancelled"
            echo "$NEEDS_JSON" | jq 'to_entries | map({job: .key, result: .value.result})'
            exit 1
          fi
          echo "All needed jobs passed or were skipped."
          echo "$NEEDS_JSON" | jq 'to_entries | map({job: .key, result: .value.result})'
