# CI: check, dependency-review. Nix runs in ci-nix.yml when deps change.
# Uses built-in paths-ignore: skip when only *.md, only .github/**, or only website/** changes.
# .github-only changes run ci-workflows.yml (minimal check).
# Website-only changes run ci-website.yml (build only; no unit/integration tests).

name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.github/**'
      - 'website/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.github/**'
      - 'website/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependency-review:
    # Skip for Dependabot Bun PRs: GitHub's dependency graph may not support bun.lock yet.
    # Vulnerability detection is covered by bun audit in the check job.
    if: |
      github.event_name == 'pull_request' &&
      !(github.actor == 'dependabot[bot]' && startsWith(github.event.pull_request.head.ref, 'dependabot/bun-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4

  check:
    # timeout-minutes not settable on reusable-call jobs; check.yml caps the check job at 20m
    permissions:
      contents: read
      models: read
    uses: ./.github/workflows/check.yml
    secrets: inherit

  integration:
    # timeout-minutes not settable on reusable-call jobs; integration.yml caps jobs internally
    permissions:
      contents: read
      models: read
    uses: ./.github/workflows/integration.yml
