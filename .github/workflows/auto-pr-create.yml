# Auto-PR — privileged CREATE ingress (ADR 0016 decision 4). This workflow is triggered by
# workflow_run after the unprivileged "Auto-PR" (generate) workflow completes. GitHub ALWAYS
# evaluates a workflow_run-triggered workflow's definition — its code, permissions:, and secrets
# access — from the DEFAULT BRANCH, regardless of what ref triggered the upstream run. A pushed
# ai/** branch therefore cannot substitute this file, its permissions, or the executor it runs.
#
# This file enumerates data artifacts from the exact triggering run and fans out one reusable create
# call per artifact. It passes only raw workflow_run repository/conclusion/run identity plus the
# selected artifact ID. Source branch/SHA identity comes exclusively from each validated manifest;
# workflow_run.head_branch/head_sha describe the default-branch ingress for scheduled/manual runs and
# are never trusted as source identity. All privileged validation remains in the reusable workflow.
#
# Reusable workflow ref: always a commit SHA (see auto-pr.yml). Update the pin to HEAD after each
# push; after merge to main, pin to the merge commit SHA (update-workflow-pins / INTEGRATION).

name: Auto-PR create

on:
  workflow_run:
    workflows: ["Auto-PR"]
    types:
      - completed

permissions: {}

jobs:
  enumerate:
    permissions:
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.artifacts.outputs.matrix }}
      has_artifacts: ${{ steps.artifacts.outputs.has_artifacts }}
    steps:
      - name: Enumerate PR content artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          pages="$(mktemp)"
          trap 'rm -f "$pages"' EXIT
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" > "$pages"
          matrix="$(jq -cs '
            if all(.[]; type == "object" and (.artifacts? | type == "array"))
              and all(.[] | .artifacts[]; (.id? | type == "number") and (.name? | type == "string") and (.expired? | type == "boolean"))
            then
              {
                include: [
                  .[] | .artifacts[]
                  | select(.expired == false and (.name | startswith("pr-content-")))
                  | {artifact_id: (.id | tostring)}
                ] | unique_by(.artifact_id)
              }
            else
              error("malformed workflow artifact API response")
            end
          ' "$pages")"
          count="$(printf '%s' "$matrix" | jq -er '.include | length')"
          {
            printf 'matrix=%s\n' "$matrix"
            if [ "$count" -gt 0 ]; then
              echo "has_artifacts=true"
            else
              echo "has_artifacts=false"
            fi
          } >> "$GITHUB_OUTPUT"
          echo "Found $count PR content artifact(s) in triggering run $RUN_ID."

  create:
    needs: enumerate
    if: needs.enumerate.outputs.has_artifacts == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.enumerate.outputs.matrix) }}
    # Job-level permissions cap the reusable's GITHUB_TOKEN (reusable permissions can only be
    # reduced, never elevated). pull-requests: write lives here at the JOB level (not the workflow
    # top level) so it applies only to this privileged call; the App token used for the actual
    # PR write is minted inside the reusable, gated on `environment: app-credentials` (Task 1.3c).
    # actions: read is required so the reusable can download the triggering run's artifact via the
    # API (actions/download-artifact with run-id); a reusable cannot add a permission the caller
    # did not grant, so it must be granted here (ADR 0016 decision 5).
    permissions:
      contents: read
      pull-requests: write
      actions: read
    uses: knirski/auto-pr/.github/workflows/auto-pr-create-reusable.yml@a6b982130853c9b5f824aa24627463cccdeaef43
    with:
      # Raw run context plus the exact run-scoped artifact selected by the enumeration matrix.
      workflow_run_id: ${{ github.event.workflow_run.id }}
      artifact_id: ${{ matrix.artifact_id }}
      source_repository: ${{ github.event.workflow_run.repository.full_name }}
      conclusion: ${{ github.event.workflow_run.conclusion }}
    secrets: inherit
