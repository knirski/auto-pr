name: release-please

on:
  push:
    branches:
      - main

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    # Protected environment (ADR 0016 decision 8): APP_ID/APP_PRIVATE_KEY resolve from the
    # `app-credentials` environment, whose deployment-branch policy admits only the default branch
    # (main) with admin-bypass disabled, so the App secret is unreachable from any non-default ref.
    # This job is push:[main]-only, so its GITHUB_REF is always main and the policy always passes.
    environment: app-credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Release please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          token: ${{ steps.app-token.outputs.token }}
