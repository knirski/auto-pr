# Builds dist/ and commits it to main when source changes.
# Ensures npx -p github:knirski/auto-pr works for Node-only users (no Bun).
# Runs on push to main when src/pkg/build/bun.lock change, or workflow_dispatch.
# Loop prevention: skips when commit message starts with "chore: update dist".
# Only runs in knirski/auto-pr (skips forks).
#
# dist/ is in .gitignore so local PRs stay clean. Uses build-and-commit-dist action.

name: Update dist

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'scripts/build.ts'
      - 'bun.lock'
  workflow_dispatch:

concurrency:
  group: update-dist-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  update-dist:
    if: |
      github.repository == 'knirski/auto-pr' &&
      (github.event_name != 'push' || github.event.head_commit == null || !startsWith(github.event.head_commit.message, 'chore: update dist'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Protected environment (ADR 0016 decision 8): APP_ID/APP_PRIVATE_KEY resolve from the
    # `app-credentials` environment, whose deployment-branch policy admits only the default branch
    # (main) with admin-bypass disabled, so the App secret is unreachable from any non-default ref.
    # Triggers are push:[main] + workflow_dispatch; both resolve against main, so the policy passes.
    # Repository-level APP_ID/APP_PRIVATE_KEY are intentionally left in place until verified.
    environment: app-credentials
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Build and commit dist
        uses: ./.github/actions/build-and-commit-dist
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.app-token.outputs.token }}
