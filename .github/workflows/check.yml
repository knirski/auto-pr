# Reusable workflow: run deterministic PR checks (test, lint, typecheck, rumdl, typos, actionlint, shellcheck, lychee, Codecov).
# Called by ci.yml (runs when non-.md files change). Integration tests run separately via integration.yml.
# No Nix — uses GitHub Actions for rumdl/typos/lychee/actionlint/shellcheck.

name: Check

on:
  workflow_call:

concurrency:
  # Caller name is often "CI" for multiple entry workflows; suffix avoids cross-cancelling other Check reusables.
  group: ${{ github.workflow }}-${{ github.ref }}-check-full
  cancel-in-progress: true

permissions: {}

env:
  # Exercise Node 24 action compatibility before GitHub makes it the runner default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Self-referential uses: must share one SHA, that commit must include each referenced path (see update-workflow-pins check_only).
      - name: Verify self-referential workflow pins
        uses: ./.github/actions/update-workflow-pins
        with:
          check_only: 'true'

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action uploads SARIF with rootDirectory=$HOME; on GitHub-hosted runners
          # the workspace is under /home/runner, but act mounts the repo at the host path, so
          # HOME must match the workspace for artifact paths to validate.
          HOME: ${{ github.workspace }}

      - name: Setup runtime (Node or alternative) with cache
        id: setup
        uses: ./.github/actions/setup-runtime

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

      - name: Check code (test, lint, typecheck)
        run: bun run check:code

      - name: Markdown lint
        uses: rvben/rumdl@0d5bbfcc2cdcff3383d188c6323dbac008eff498 # v0.2.63

      - name: Spell check
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1

      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Lint scripts (shellcheck, shfmt)
        uses: luizm/action-sh-checker@883217215b11c1fabbf00eb1a9a041f62d74c744 # v0.10.0
        with:
          # shfmt -f . would otherwise list scripts under node_modules after bun install
          sh_checker_exclude: node_modules dist coverage .worktrees website/node_modules
        env:
          SHFMT_OPTS: -d

      - name: Check links
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/lychee-with-link-cache
        with:
          args: --timeout 90 --max-retries 10 --retry-wait-time 2 --no-progress --accept 200,429 .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          plugins: noop
          disable_search: true

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test-report.junit.xml
          report_type: test_results
          fail_ci_if_error: false
          disable_search: true
