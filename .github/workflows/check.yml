# Reusable workflow: run full check (test, lint, typecheck, rumdl, typos, actionlint, shellcheck, lychee, SBOM, Codecov).
# Called by ci.yml (runs when non-.md files change). Integration tests run separately via integration.yml.
# No Nix — uses GitHub Actions for rumdl/typos/lychee/actionlint/shellcheck.

name: Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action uploads SARIF with rootDirectory=$HOME; on GitHub-hosted runners
          # the workspace is under /home/runner, but act mounts the repo at the host path, so
          # HOME must match the workspace for artifact paths to validate.
          HOME: ${{ github.workspace }}

      # setup-runtime: use full path so callers don't need the action. Relative ./ would
      # resolve to caller's repo. Update @SHA when updating workflow refs (see auto-pr.yml).
      - name: Setup runtime (Node or alternative) with cache
        id: setup
        uses: knirski/auto-pr/.github/actions/setup-runtime@970332ee3597e8321783123feb49423de70cf5ce

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

      - name: Check code (test, lint, typecheck)
        run: bun run check:code

      - name: Markdown lint
        uses: rvben/rumdl@6540b53fa24e83f9693e36889e0f9c765aa90349 # v0.1.67

      - name: Spell check
        uses: crate-ci/typos@02ea592e44b3a53c302f697cddca7641cd051c3d # v1.45.0

      - name: Lint workflows
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2

      - name: Lint scripts (shellcheck, shfmt)
        uses: luizm/action-sh-checker@883217215b11c1fabbf00eb1a9a041f62d74c744 # v0.10.0
        env:
          SHFMT_OPTS: -d

      # SBOM: lockfile graph only — same concerns as unit tests/lint, not integration or act.
      - name: Setup Node (for SBOM)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".nvmrc"

      - name: Generate SBOM
        # --ignore-scripts: skip prepare (bun build); SBOM only needs the lockfile graph.
        run: npm install --ignore-scripts && npm sbom --sbom-format cyclonedx > sbom.json

      - name: Upload SBOM
        # upload-artifact@v7 sends mime_type; act's artifact server unmarshals CreateArtifact with strict
        # protojson and rejects unknown fields (nektos/act#6022). Upstream: open PRs e.g. #6039 / #6053
        # (DiscardUnknown) — after merge and an act release, this guard can be removed if desired.
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sbom
          path: sbom.json

      - name: Check links
        continue-on-error: true
        timeout-minutes: 2
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: --timeout 90 --max-retries 10 --retry-wait-time 2 --no-progress --accept 200,429 .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          plugins: noop
          disable_search: true

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test-report.junit.xml
          report_type: test_results
          fail_ci_if_error: false
          disable_search: true
