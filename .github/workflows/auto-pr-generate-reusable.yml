# Reusable workflow: generate PR content only (unprivileged).
# Checkout of branch (untrusted) with contents: read only. Optional GH_TOKEN secret
# when ai_provider is github-models (GitHub Models API).
# Satisfies CodeQL "untrusted checkout in trusted context" — no privileged context.
#
# Call with create workflow: generate job → create job (needs: generate).
# See auto-pr.yml for the pattern.

name: Auto-PR generate (reusable)

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        description: "Token for GitHub Models API when ai_provider is github-models"
        required: false
    outputs:
      auto_pr_pkg:
        description: "Package spec for npx (e.g. github:knirski/auto-pr#branch)"
        value: ${{ jobs.generate.outputs.auto_pr_pkg }}
    inputs:
      ai_provider:
        required: false
        type: string
        default: "ollama"
      ai_ollama_model:
        required: false
        type: string
        default: "llama3.1:8b"
      ai_github_model:
        required: false
        type: string
        default: ""
      ai_openai_compat_url:
        required: false
        type: string
        default: ""
      ai_openai_compat_api_key:
        required: false
        type: string
        default: ""
      ai_openai_compat_model:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  generate:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      auto_pr_pkg: ${{ steps.auto-pr-pkg.outputs.value }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Check prerequisites (template only)
        run: |
          if [ ! -f ".github/PULL_REQUEST_TEMPLATE.md" ]; then
            echo "::error::Missing .github/PULL_REQUEST_TEMPLATE.md. Run: npx -p github:knirski/auto-pr auto-pr-init"
            echo "::error::See https://github.com/knirski/auto-pr#integration"
            exit 1
          fi

      # setup-runtime: use full path so callers don't need the action. Relative ./ would
      # resolve to caller's repo. Update @SHA when updating workflow refs (see auto-pr.yml).
      - name: Setup runtime (Node or alternative) with cache
        id: setup
        uses: knirski/auto-pr/.github/actions/setup-runtime@57f2adb515f39ef60f14eeea1e9cde36bbe5ef9d

      - name: Fetch base branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git fetch origin "$DEFAULT_BRANCH"

      - name: Set auto-pr package ref
        id: auto-pr-pkg
        env:
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: bash scripts/auto-pr-set-pkg.sh

      - name: Install dependencies (workspace only)
        if: steps.auto-pr-pkg.outputs.use_workspace == 'true'
        run: bun install --frozen-lockfile

      - name: Get commit log and changed files
        id: commits
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUTO_PR_PKG: ${{ steps.auto-pr-pkg.outputs.value }}
          RUNNER: ${{ steps.setup.outputs.runner }}
          USE_WORKSPACE: ${{ steps.auto-pr-pkg.outputs.use_workspace }}
        run: bash scripts/auto-pr-run-command.sh get-commits

      - name: Setup Ollama
        if: steps.commits.outputs.count != '1' && inputs.ai_provider == 'ollama'
        uses: ai-action/setup-ollama@8dace3eab22ce4d761427bb75f8f70f1270ea660 # v2

      - name: Pull model
        if: steps.commits.outputs.count != '1' && inputs.ai_provider == 'ollama'
        env:
          OLLAMA_MODEL: ${{ inputs.ai_ollama_model }}
        run: |
          if [[ ! "$OLLAMA_MODEL" =~ ^[a-zA-Z0-9._:-]+$ ]]; then
            echo "::error::Invalid ai_ollama_model: must match ^[a-zA-Z0-9._:-]+$"
            exit 1
          fi
          ollama pull "$OLLAMA_MODEL"

      - name: Generate PR content
        id: generate
        env:
          AUTO_PR_AI_PROVIDER: ${{ inputs.ai_provider }}
          AUTO_PR_AI_OLLAMA_MODEL: ${{ inputs.ai_ollama_model }}
          AUTO_PR_AI_GITHUB_MODEL: ${{ inputs.ai_github_model }}
          AUTO_PR_AI_OPENAI_COMPAT_URL: ${{ inputs.ai_openai_compat_url }}
          AUTO_PR_AI_OPENAI_COMPAT_API_KEY: ${{ inputs.ai_openai_compat_api_key }}
          AUTO_PR_AI_OPENAI_COMPAT_MODEL: ${{ inputs.ai_openai_compat_model }}
          GH_TOKEN: ${{ inputs.ai_provider == 'github-models' && secrets.GH_TOKEN || '' }}
          AUTO_PR_PKG: ${{ steps.auto-pr-pkg.outputs.value }}
          RUNNER: ${{ steps.setup.outputs.runner }}
          USE_WORKSPACE: ${{ steps.auto-pr-pkg.outputs.use_workspace }}
        run: bash scripts/auto-pr-run-command.sh generate-content

      - name: Prepare artifact
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p pr-content
          cp "$GITHUB_WORKSPACE/pr-title.txt" pr-content/title.txt
          cp "$GITHUB_WORKSPACE/pr-body.md" pr-content/body.md
          echo -n "$BRANCH" > pr-content/branch.txt
          echo -n "$DEFAULT_BRANCH" > pr-content/default_branch.txt

      - name: Upload PR content
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pr-content
          path: pr-content/
