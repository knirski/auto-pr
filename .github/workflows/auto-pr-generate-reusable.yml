# Reusable workflow: generate PR content only (unprivileged).
# Checkout of branch (untrusted) with contents: read only. Optional GH_TOKEN secret for GitHub API
# reads (existing PR title lookup). Optional OPENROUTER_API_KEY secret for cloud inference when
# ai_provider is openrouter (default); secret-bearing steps run trusted package code only.
# Satisfies CodeQL "untrusted checkout in trusted context" — no privileged context.
#
# Called from auto-pr.yml's matrix-fanned `generate` job (unprivileged ingress, ADR 0016). The
# privileged create phase is a SEPARATE workflow_run-triggered file (auto-pr-create.yml), not a
# needs:-chained job in this run — see ADR 0016 decision 4.

name: Auto-PR generate (reusable)

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        description: "Token for GitHub API reads (existing PR title lookup); defaults to the job token"
        required: false
      OPENROUTER_API_KEY:
        description: "OpenRouter API key. Required for cloud inference when ai_provider is openrouter."
        required: false
    # No outputs: the generate phase is a data producer only. It must never emit a
    # package/executable reference for a privileged job to install (ADR 0016 decisions 3, 6).
    # PR content + immutable identity/digests are delivered via the uploaded artifact manifest.
    inputs:
      # Explicit head SHA to check out and record (ADR 0016 decision 3). The caller resolves the
      # ai/** branch's current tip via API and passes the immutable commit here — never a mutable
      # branch ref name. Under the new default-branch ingress (workflow_dispatch/schedule) the
      # ambient github.ref/github.sha point at the default branch, so the source commit must be
      # supplied explicitly.
      head_sha:
        required: true
        type: string
        description: "Immutable commit SHA of the ai/** branch tip to generate against."
      # The ai/** source branch name, recorded in the artifact manifest (source_branch) and used
      # for PR content. Supplied explicitly for the same reason as head_sha.
      source_branch:
        required: true
        type: string
        description: "The ai/** source branch name being generated for."
      ai_provider:
        required: false
        type: string
        default: "openrouter"
      ai_openrouter_model:
        required: false
        type: string
        description: "Optional OpenRouter model id override. Must be a free model (vendor/model:free)."
        default: ""
      ai_openrouter_http_referer:
        required: false
        type: string
        description: "Optional OpenRouter HTTP-Referer attribution header value."
        default: ""
      ai_openrouter_title:
        required: false
        type: string
        description: "Optional OpenRouter X-Title attribution header value."
        default: ""
      ai_openai_compat_url:
        required: false
        type: string
        default: ""
      ai_openai_compat_api_key:
        required: false
        type: string
        default: ""
      ai_llamacpp_release_tag:
        required: false
        type: string
        description: >-
          Optional override for the Docker image (full ghcr.io/... ref, or short suffix after server-). When empty,
          uses the image from the first FROM line in .github/llama-server/Dockerfile.
        default: ""
      ai_llamacpp_model_url:
        required: false
        type: string
        description: "HTTPS URL to a .gguf model. When set with ai_provider=local and ai_openai_compat_url empty, uses .github/llama-server/Dockerfile for the image pin, caches the GGUF and Docker image tarball, and starts llama-server in Docker (docker run)."
        default: ""
      ai_llamacpp_port:
        required: false
        type: string
        description: "Port for llama-server when using ai_llamacpp_model_url"
        default: "8080"

# Key concurrency on the source branch, not github.ref: under the default-branch ingress every
# matrix-fanned-out call runs with github.ref == the default branch, so a github.ref-keyed group
# would make sibling matrix entries (different branches) cancel each other. Keying on
# inputs.source_branch lets distinct branches run in parallel while a newer generate for the same
# branch supersedes an older one.
concurrency:
  group: ${{ github.workflow }}-auto-pr-generate-${{ inputs.source_branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  generate:
    permissions:
      contents: read
      pull-requests: read # gh pr view (existing PR title) when token allows
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Validate source branch
        id: validate
        uses: knirski/auto-pr/.github/actions/auto-pr-validate-source@8a98a0da2c396d1016bfa0173795f3af3c597c78
        with:
          expected_sha: ${{ inputs.head_sha }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          source_branch: ${{ inputs.source_branch }}
      # codeql[actions/untrusted-checkout] False positive: this reusable workflow is analyzed by
      # CodeQL without caller context, but the job is unprivileged by construction (ADR 0016
      # decision 3). It checks out an explicit, caller-resolved head SHA (never a mutable ref) with
      # contents/pull-requests: read only — no write access and no GitHub App credential. The
      # optional read-scoped GH_TOKEN defaults to github.token, and the optional OpenRouter
      # inference key is confined to trusted package-mode steps (see below). Its sole
      # output is the data-only pr-content artifact; the privileged create phase is a SEPARATE
      # workflow_run executor that performs no checkout, so this checkout is never privileged.
      - name: Checkout branch
        if: steps.validate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check prerequisites (template only)
        if: steps.validate.outputs.skip != 'true'
        run: |
          if [ ! -f ".github/PULL_REQUEST_TEMPLATE.md" ]; then
            echo "::error::Missing .github/PULL_REQUEST_TEMPLATE.md. Run: npx -p github:knirski/auto-pr auto-pr-init"
            echo "::error::See https://github.com/knirski/auto-pr#integration"
            exit 1
          fi

      # Full paths to knirski/auto-pr actions (not ./ in caller). Update @SHA when bumping pins (see auto-pr.yml).
      - name: Setup runtime (Node or alternative) with cache
        id: setup
        if: steps.validate.outputs.skip != 'true'
        uses: knirski/auto-pr/.github/actions/setup-runtime@8a98a0da2c396d1016bfa0173795f3af3c597c78

      - name: Fetch base branch
        if: steps.validate.outputs.skip != 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git fetch origin "$DEFAULT_BRANCH"

      # Determine only HOW this unprivileged generate job invokes its own commands (same-repo
      # workspace `bun run` vs published-package `npx`). This selects nothing a privileged job
      # runs: the branch-derived package ref was removed (ADR 0016 decisions 3, 6).
      - name: Determine auto-pr workspace mode
        id: auto-pr-pkg
        if: steps.validate.outputs.skip != 'true'
        uses: knirski/auto-pr/.github/actions/auto-pr-set-pkg@8a98a0da2c396d1016bfa0173795f3af3c597c78
        with:
          repository: ${{ github.repository }}
          runner: ${{ steps.setup.outputs.runner }}

      - name: Install dependencies (workspace only)
        if: steps.validate.outputs.skip != 'true' && steps.auto-pr-pkg.outputs.use_workspace == 'true' && steps.setup.outputs.runner == 'bunx'
        run: bun install --frozen-lockfile

      - name: Count non-merge commits
        id: commits
        if: steps.validate.outputs.skip != 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          count=$(git log --format=%s "origin/$DEFAULT_BRANCH..HEAD" | grep -cvE '^Merge ' || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Check for semantic commits
        id: semantic
        if: steps.validate.outputs.skip != 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git log --format=%s "origin/$DEFAULT_BRANCH..HEAD" | grep -E '^[[:alpha:]][[:alnum:]-]*(\([^)]*\))?!?: .+' >/dev/null; then
            echo "should_create_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_create_pr=false" >> "$GITHUB_OUTPUT"
            echo "No semantic commits found; uploading a skip marker."
          fi

      - name: Build model routing context
        id: ai_routing
        if: steps.validate.outputs.skip != 'true' && steps.semantic.outputs.should_create_pr == 'true'
        uses: knirski/auto-pr/.github/actions/auto-pr-run-command@8a98a0da2c396d1016bfa0173795f3af3c597c78
        with:
          command: build-model-routing-context
          # Secret-bearing OpenRouter steps must run trusted package code, never branch-controlled
          # workspace scripts. The package ref is the same immutable SHA that pins this file's
          # knirski/auto-pr self-refs; bump both in the same commit. Non-OpenRouter providers keep
          # the existing workspace/package selection (constant ref, ADR 0016 decision 6).
          use_workspace: ${{ inputs.ai_provider == 'openrouter' && 'false' || steps.auto-pr-pkg.outputs.use_workspace }}
          auto_pr_pkg: ${{ inputs.ai_provider == 'openrouter' && 'github:knirski/auto-pr#8a98a0da2c396d1016bfa0173795f3af3c597c78' || 'github:knirski/auto-pr' }}
          trusted_package_required: ${{ inputs.ai_provider == 'openrouter' && 'true' || 'false' }}
          runner: ${{ steps.setup.outputs.runner }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          COMMITS_COUNT: ${{ steps.commits.outputs.count }}
          AUTO_PR_AI_PROVIDER: ${{ inputs.ai_provider }}
          OPENROUTER_API_KEY: ${{ inputs.ai_provider == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
          AUTO_PR_OPENROUTER_MODEL: ${{ inputs.ai_openrouter_model }}
          AUTO_PR_AI_OPENAI_COMPAT_URL: ${{ inputs.ai_openai_compat_url }}
          AUTO_PR_AI_LLAMACPP_MODEL_URL: ${{ inputs.ai_llamacpp_model_url }}
          RUNNER_LABEL: ubuntu-24.04
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}

      - name: Resolve llama Docker image
        id: llama_release
        if: steps.validate.outputs.skip != 'true' && steps.semantic.outputs.should_create_pr == 'true'
        uses: knirski/auto-pr/.github/actions/resolve-llama-server-tag@8a98a0da2c396d1016bfa0173795f3af3c597c78
        with:
          commits_count: ${{ steps.commits.outputs.count }}
          ai_provider: ${{ inputs.ai_provider }}
          ai_llamacpp_model_url: ${{ inputs.ai_llamacpp_model_url }}
          ai_openai_compat_url: ${{ inputs.ai_openai_compat_url }}
          ai_llamacpp_release_tag: ${{ inputs.ai_llamacpp_release_tag }}

      - name: Local llama.cpp — cache key
        id: llama_cache_key
        if: steps.validate.outputs.skip != 'true' && steps.semantic.outputs.should_create_pr == 'true' && steps.commits.outputs.count != '1' && inputs.ai_provider == 'local' && inputs.ai_llamacpp_model_url != '' && inputs.ai_openai_compat_url == ''
        env:
          MODEL_URL: ${{ inputs.ai_llamacpp_model_url }}
        run: |
          h=$(printf '%s' "$MODEL_URL" | sha256sum | awk '{print $1}')
          echo "hash=$h" >> "$GITHUB_OUTPUT"

      - name: Cache llama.cpp (GGUF model + Docker image tar)
        if: steps.validate.outputs.skip != 'true' && steps.semantic.outputs.should_create_pr == 'true' && steps.commits.outputs.count != '1' && inputs.ai_provider == 'local' && inputs.ai_llamacpp_model_url != '' && inputs.ai_openai_compat_url == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/auto-pr-llama
          key: llama-${{ steps.llama_release.outputs.tag }}-${{ steps.llama_cache_key.outputs.hash }}-docker

      - name: Start local llama.cpp (Docker)
        id: local_llama
        if: steps.validate.outputs.skip != 'true' && steps.semantic.outputs.should_create_pr == 'true' && steps.commits.outputs.count != '1' && inputs.ai_provider == 'local' && inputs.ai_llamacpp_model_url != '' && inputs.ai_openai_compat_url == ''
        uses: knirski/auto-pr/.github/actions/llama-server-docker-start@8a98a0da2c396d1016bfa0173795f3af3c597c78
        with:
          docker_image: ${{ steps.llama_release.outputs.image }}
          model_url: ${{ inputs.ai_llamacpp_model_url }}
          llama_server_root: ${{ runner.temp }}/auto-pr-llama
          llama_port: ${{ inputs.ai_llamacpp_port }}

      - name: Generate PR content
        id: generate
        if: steps.validate.outputs.skip != 'true' && steps.semantic.outputs.should_create_pr == 'true'
        uses: knirski/auto-pr/.github/actions/auto-pr-run-command@8a98a0da2c396d1016bfa0173795f3af3c597c78
        with:
          command: generate-content
          # Same trusted-package confinement as the routing step: the OpenRouter key may only sit
          # next to immutable trusted package code, never branch-controlled workspace scripts.
          use_workspace: ${{ inputs.ai_provider == 'openrouter' && 'false' || steps.auto-pr-pkg.outputs.use_workspace }}
          auto_pr_pkg: ${{ inputs.ai_provider == 'openrouter' && 'github:knirski/auto-pr#8a98a0da2c396d1016bfa0173795f3af3c597c78' || 'github:knirski/auto-pr' }}
          trusted_package_required: ${{ inputs.ai_provider == 'openrouter' && 'true' || 'false' }}
          runner: ${{ steps.setup.outputs.runner }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ inputs.source_branch }}
          AUTO_PR_AI_PROVIDER: ${{ inputs.ai_provider }}
          OPENROUTER_API_KEY: ${{ inputs.ai_provider == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
          AUTO_PR_OPENROUTER_MODEL: ${{ inputs.ai_openrouter_model }}
          AUTO_PR_OPENROUTER_HTTP_REFERER: ${{ inputs.ai_openrouter_http_referer }}
          AUTO_PR_OPENROUTER_TITLE: ${{ inputs.ai_openrouter_title }}
          AUTO_PR_AI_OPENAI_COMPAT_URL: ${{ steps.local_llama.outcome == 'success' && format('http://127.0.0.1:{0}/v1', inputs.ai_llamacpp_port) || inputs.ai_openai_compat_url }}
          AUTO_PR_AI_OPENAI_COMPAT_API_KEY: ${{ inputs.ai_openai_compat_api_key }}
          AUTO_PR_LOCAL_MODEL: ${{ steps.local_llama.outputs.model_id }}
          AUTO_PR_ROUTING_DECISION_JSON: ${{ steps.ai_routing.outputs.routing_decision_json }}
          AUTO_PR_ROUTING_CONTEXT_JSON: ${{ steps.ai_routing.outputs.routing_context_json }}
          # Caller may pass PAT via secret; if unset, use job token (caller secret forward can be empty).
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Stop local llama-server (Docker)
        if: always() && steps.local_llama.outcome != 'skipped'
        uses: knirski/auto-pr/.github/actions/llama-server-docker-stop@8a98a0da2c396d1016bfa0173795f3af3c597c78

      # Produce the artifact as DATA ONLY (no executable content, no glob patterns): two content
      # files plus a versioned manifest carrying immutable identity fields and SHA-256 content
      # digests. The privileged create phase (a later task) validates against this manifest —
      # head SHA, source repo/branch, default branch, and digests — without trusting the
      # artifact transport (ADR 0016 decisions 5, 6). See docs for the manifest schema (v1).
      - name: Prepare artifact
        id: artifact
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ inputs.source_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SHOULD_CREATE_PR: ${{ steps.semantic.outputs.should_create_pr }}
        run: |
          mkdir -p pr-content
          if [ "$SHOULD_CREATE_PR" = "true" ]; then
            cp "$GITHUB_WORKSPACE/pr-title.txt" pr-content/title.txt
            cp "$GITHUB_WORKSPACE/pr-body.md" pr-content/body.md
          else
            : > pr-content/title.txt
            : > pr-content/body.md
          fi
          # Head SHA as a standalone file: the exact commit generate ran against. The create
          # phase cross-checks this against manifest.head_sha and the current branch tip.
          printf '%s' "$HEAD_SHA" > pr-content/head_sha.txt
          branch_identity=$(printf '%s' "$BRANCH" | sha256sum | awk '{print $1}')
          echo "name=pr-content-${HEAD_SHA}-${branch_identity}" >> "$GITHUB_OUTPUT"
          title_sha256=$(sha256sum pr-content/title.txt | awk '{print $1}')
          body_sha256=$(sha256sum pr-content/body.md | awk '{print $1}')
          jq -n \
            --argjson manifest_version 1 \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --arg source_branch "$BRANCH" \
            --arg default_branch "$DEFAULT_BRANCH" \
            --arg head_sha "$HEAD_SHA" \
            --arg title_sha256 "$title_sha256" \
            --arg body_sha256 "$body_sha256" \
            --arg status "$SHOULD_CREATE_PR" \
            '{
              manifest_version: $manifest_version,
              status: (if $status == "true" then "generated" else "skipped" end),
              source_repository: $source_repository,
              source_branch: $source_branch,
              default_branch: $default_branch,
              head_sha: $head_sha,
              files: {
                title: { path: "title.txt", sha256: $title_sha256 },
                body: { path: "body.md", sha256: $body_sha256 }
              }
            }' > pr-content/manifest.json

      - name: Upload PR content
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: pr-content/
