# Reusable workflow: generate PR content only (unprivileged).
# Checkout of branch (untrusted) with contents: read only. Optional GH_TOKEN secret
# when ai_provider is github-models (GitHub Models API).
# Satisfies CodeQL "untrusted checkout in trusted context" — no privileged context.
#
# Call with create workflow: generate job → create job (needs: generate).
# See auto-pr.yml for the pattern.

name: Auto-PR generate (reusable)

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        description: "Token for GitHub Models API when ai_provider is github-models"
        required: false
    outputs:
      auto_pr_pkg:
        description: "Package spec for npx (e.g. github:knirski/auto-pr#branch)"
        value: ${{ jobs.generate.outputs.auto_pr_pkg }}
    inputs:
      ai_provider:
        required: false
        type: string
        default: "github-models"
      ai_openai_compat_url:
        required: false
        type: string
        default: ""
      ai_openai_compat_api_key:
        required: false
        type: string
        default: ""
      ai_openai_compat_model:
        required: false
        type: string
        description: "Model id (publisher/model). For github-models, legal values are catalog entry ids — see docs/INTEGRATION.md#github-models"
        default: ""
      ai_llamacpp_release_tag:
        required: false
        type: string
        description: >-
          Optional override for the Docker image (full ghcr.io/... ref, or short suffix after server-). When empty,
          uses the image from the first FROM line in .github/llama-server/Dockerfile.
        default: ""
      ai_llamacpp_model_url:
        required: false
        type: string
        description: "HTTPS URL to a .gguf model. When set with ai_provider=local and ai_openai_compat_url empty, uses .github/llama-server/Dockerfile for the image pin, caches the GGUF and Docker image tarball, and starts llama-server in Docker (docker run)."
        default: ""
      ai_llamacpp_port:
        required: false
        type: string
        description: "Port for llama-server when using ai_llamacpp_model_url"
        default: "8080"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-auto-pr-generate
  cancel-in-progress: true

permissions: {}

jobs:
  generate:
    permissions:
      contents: read
      pull-requests: read # gh pr view (existing PR title) when token allows
      models: read # GitHub Models API (github-models provider) with GITHUB_TOKEN or GH_TOKEN
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      auto_pr_pkg: ${{ steps.auto-pr-pkg.outputs.value }}
    steps:
      # codeql[actions/untrusted-checkout] github.ref_name in workflow_call context is the
      # calling workflow's own ref (a pushed branch via push trigger), never a PR head.
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check prerequisites (template only)
        run: |
          if [ ! -f ".github/PULL_REQUEST_TEMPLATE.md" ]; then
            echo "::error::Missing .github/PULL_REQUEST_TEMPLATE.md. Run: npx -p github:knirski/auto-pr auto-pr-init"
            echo "::error::See https://github.com/knirski/auto-pr#integration"
            exit 1
          fi

      # Full paths to knirski/auto-pr actions (not ./ in caller). Update @SHA when bumping pins (see auto-pr.yml).
      - name: Setup runtime (Node or alternative) with cache
        id: setup
        uses: knirski/auto-pr/.github/actions/setup-runtime@37208f2bc550f3b7526a3c7bd581ded7f2dc6a5a

      - name: Fetch base branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git fetch origin "$DEFAULT_BRANCH"

      - name: Set auto-pr package ref
        id: auto-pr-pkg
        uses: knirski/auto-pr/.github/actions/auto-pr-set-pkg@37208f2bc550f3b7526a3c7bd581ded7f2dc6a5a
        with:
          repository: ${{ github.repository }}
          ref_name: ${{ github.ref_name }}

      - name: Install dependencies (workspace only)
        if: steps.auto-pr-pkg.outputs.use_workspace == 'true'
        run: bun install --frozen-lockfile

      - name: Count non-merge commits
        id: commits
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          count=$(git log --format=%s "origin/$DEFAULT_BRANCH..HEAD" | grep -cvE '^Merge ' || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Select model band and build routing context
        id: ai_routing
        if: steps.commits.outputs.count != '1'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AI_PROVIDER: ${{ inputs.ai_provider }}
          INPUT_MODEL: ${{ inputs.ai_openai_compat_model }}
        run: |
          set -euo pipefail

          range="origin/$DEFAULT_BRANCH..HEAD"
          n_sem="${{ steps.commits.outputs.count }}"

          # All changed paths in the PR range.
          files=$(git diff --name-only "$range")
          s_spread=$(printf '%s\n' "$files" | sed '/^$/d' | awk -F/ '{print $1}' | sort -u | wc -l | tr -d ' ')

          # Distinguish generated-noise churn from source churn.
          # Binary rows in numstat are "-" (treated as 0 line churn).
          numstat=$(git diff --numstat "$range")
          metrics=$(printf '%s\n' "$numstat" | awk '
            function is_generated(path) {
              return (
                path ~ /(^|\/)(dist|build|out|coverage|vendor|__snapshots__|\.terraform)(\/|$)/ ||
                path ~ /(^|\/)\.next(\/|$)/ ||
                path ~ /(^|\/)(pnpm-lock\.yaml|package-lock\.json|Cargo\.lock|go\.sum)$/ ||
                path ~ /\.lock$/ ||
                path ~ /\.min\.js$/ ||
                path ~ /\.map$/
              )
            }
            {
              ins = ($1 == "-" ? 0 : $1) + 0
              del = ($2 == "-" ? 0 : $2) + 0
              path = $3
              churn = ins + del
              raw += churn
              if (is_generated(path)) {
                gen += churn
              } else {
                src += churn
              }
            }
            END {
              if (raw == "") raw = 0
              if (gen == "") gen = 0
              if (src == "") src = 0
              printf "%d %d %d\n", raw, src, gen
            }')
          delta_raw=$(echo "$metrics" | awk '{print $1}')
          delta_src=$(echo "$metrics" | awk '{print $2}')
          delta_gen=$(echo "$metrics" | awk '{print $3}')

          # Conventional commit type spread as a simple synthesis hardness signal.
          type_count=$(git log --format=%s "$range" \
            | grep -vE '^Merge ' \
            | sed -nE 's/^([a-z]+)(\(.+\))?(!)?:.*/\1/p' \
            | sort -u \
            | wc -l \
            | tr -d ' ')

          has_docs=$(printf '%s\n' "$files" | grep -Eq '^docs/|\.md$' && echo true || echo false)
          has_src=$(printf '%s\n' "$files" | grep -Eq '^src/' && echo true || echo false)

          # Hardness heuristic.
          hardness=low
          if [ "$type_count" -ge 3 ] || [ "$s_spread" -ge 3 ] || { [ "$has_docs" = true ] && [ "$has_src" = true ]; }; then
            hardness=high
          elif [ "$type_count" -ge 2 ] || [ "$s_spread" -ge 2 ] || [ "$delta_src" -ge 400 ]; then
            hardness=medium
          fi

          # Bucketized source churn.
          delta_src_bucket=small
          if [ "$delta_src" -ge 1200 ]; then
            delta_src_bucket=large
          elif [ "$delta_src" -ge 350 ]; then
            delta_src_bucket=medium
          fi

          # Generated-noise ratio bucket.
          ratio_pct=0
          if [ "$delta_raw" -gt 0 ]; then
            ratio_pct=$(( delta_gen * 100 / delta_raw ))
          fi
          gen_ratio_bucket=low
          if [ "$ratio_pct" -ge 80 ]; then
            gen_ratio_bucket=high
          elif [ "$ratio_pct" -ge 35 ]; then
            gen_ratio_bucket=medium
          fi

          # Band policy.
          band=B
          if [ "$delta_raw" -gt 0 ] && [ "$delta_src" -lt 120 ] && [ "$ratio_pct" -ge 80 ]; then
            band=A
          elif { [ "$n_sem" -le 2 ] && [ "$delta_src" -lt 200 ] && [ "$hardness" = low ]; }; then
            band=A
          elif { [ "$delta_src" -ge 1200 ] || [ "$hardness" = high ] || [ "$n_sem" -ge 8 ]; }; then
            band=C
          fi

          # Explicit input model wins.
          selected_model="$INPUT_MODEL"
          if [ -z "$selected_model" ]; then
            if [ "$AI_PROVIDER" = "github-models" ]; then
              if [ "$band" = "C" ]; then
                selected_model="openai/gpt-4.1"
              else
                selected_model="microsoft/phi-4-mini-instruct"
              fi
            elif [ "$AI_PROVIDER" = "local" ]; then
              selected_model="gpt-oss"
            fi
          fi

          routing_context="band=$band; n_sem=$n_sem; delta_src=$delta_src_bucket; gen_ratio=$gen_ratio_bucket; hardness=$hardness. Prefer user-visible and breaking changes over lockfiles/generated churn."

          {
            echo "selected_model=$selected_model"
            echo "routing_context=$routing_context"
            echo "band=$band"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve llama Docker image
        id: llama_release
        uses: knirski/auto-pr/.github/actions/resolve-llama-server-tag@37208f2bc550f3b7526a3c7bd581ded7f2dc6a5a
        with:
          commits_count: ${{ steps.commits.outputs.count }}
          ai_provider: ${{ inputs.ai_provider }}
          ai_llamacpp_model_url: ${{ inputs.ai_llamacpp_model_url }}
          ai_openai_compat_url: ${{ inputs.ai_openai_compat_url }}
          ai_llamacpp_release_tag: ${{ inputs.ai_llamacpp_release_tag }}

      - name: Local llama.cpp — cache key
        id: llama_cache_key
        if: steps.commits.outputs.count != '1' && inputs.ai_provider == 'local' && inputs.ai_llamacpp_model_url != '' && inputs.ai_openai_compat_url == ''
        env:
          MODEL_URL: ${{ inputs.ai_llamacpp_model_url }}
        run: |
          h=$(printf '%s' "$MODEL_URL" | sha256sum | awk '{print $1}')
          echo "hash=$h" >> "$GITHUB_OUTPUT"

      - name: Cache llama.cpp (GGUF model + Docker image tar)
        if: steps.commits.outputs.count != '1' && inputs.ai_provider == 'local' && inputs.ai_llamacpp_model_url != '' && inputs.ai_openai_compat_url == ''
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/auto-pr-llama
          key: llama-${{ steps.llama_release.outputs.tag }}-${{ steps.llama_cache_key.outputs.hash }}-docker

      - name: Start local llama.cpp (Docker)
        id: local_llama
        if: steps.commits.outputs.count != '1' && inputs.ai_provider == 'local' && inputs.ai_llamacpp_model_url != '' && inputs.ai_openai_compat_url == ''
        uses: knirski/auto-pr/.github/actions/llama-server-docker-start@37208f2bc550f3b7526a3c7bd581ded7f2dc6a5a
        with:
          docker_image: ${{ steps.llama_release.outputs.image }}
          model_url: ${{ inputs.ai_llamacpp_model_url }}
          llama_server_root: ${{ runner.temp }}/auto-pr-llama
          llama_port: ${{ inputs.ai_llamacpp_port }}

      - name: Generate PR content
        id: generate
        uses: knirski/auto-pr/.github/actions/auto-pr-run-command@37208f2bc550f3b7526a3c7bd581ded7f2dc6a5a
        with:
          command: generate-content
          use_workspace: ${{ steps.auto-pr-pkg.outputs.use_workspace }}
          auto_pr_pkg: ${{ steps.auto-pr-pkg.outputs.value }}
          runner: ${{ steps.setup.outputs.runner }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          AUTO_PR_AI_PROVIDER: ${{ inputs.ai_provider }}
          AUTO_PR_AI_OPENAI_COMPAT_URL: ${{ steps.local_llama.outcome == 'success' && format('http://127.0.0.1:{0}/v1', inputs.ai_llamacpp_port) || inputs.ai_openai_compat_url }}
          AUTO_PR_AI_OPENAI_COMPAT_API_KEY: ${{ inputs.ai_openai_compat_api_key }}
          AUTO_PR_AI_OPENAI_COMPAT_MODEL: ${{ steps.ai_routing.outputs.selected_model || inputs.ai_openai_compat_model }}
          AUTO_PR_ROUTING_CONTEXT: ${{ steps.ai_routing.outputs.routing_context }}
          # Caller may pass PAT via secret; if unset, use job token (caller secret forward can be empty).
          GH_TOKEN: ${{ inputs.ai_provider == 'github-models' && (secrets.GH_TOKEN || github.token) || '' }}

      - name: Stop local llama-server (Docker)
        if: always() && steps.local_llama.outcome != 'skipped'
        uses: knirski/auto-pr/.github/actions/llama-server-docker-stop@37208f2bc550f3b7526a3c7bd581ded7f2dc6a5a

      - name: Prepare artifact
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p pr-content
          cp "$GITHUB_WORKSPACE/pr-title.txt" pr-content/title.txt
          cp "$GITHUB_WORKSPACE/pr-body.md" pr-content/body.md
          echo -n "$BRANCH" > pr-content/branch.txt
          echo -n "$DEFAULT_BRANCH" > pr-content/default_branch.txt

      - name: Upload PR content
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-content
          path: pr-content/
