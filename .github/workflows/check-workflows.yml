# Reusable workflow for .github-only changes.
# Runs actionlint, shellcheck, shfmt on .github/actions. Reports "check / check" for branch protection.
# See docs/CI.md.

name: Check

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Self-referential uses: must share one SHA, that commit must include each referenced path (see update-workflow-pins check_only).
      - name: Verify self-referential workflow pins
        uses: ./.github/actions/update-workflow-pins
        with:
          check_only: 'true'

      - name: Lint workflows
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2

      - name: Lint scripts (shellcheck, shfmt)
        uses: luizm/action-sh-checker@883217215b11c1fabbf00eb1a9a041f62d74c744 # v0.10.0
        with:
          sh_checker_exclude: node_modules dist coverage .worktrees website/node_modules
        env:
          SHFMT_OPTS: -d
