# Reusable workflow: create/update PR (privileged).
# No checkout — workspace is used only to stage artifact files; no repo code needed.
# Satisfies CodeQL — no checkout in this workflow.
#
# Requires: needs generate job first. Artifact pr-content from generate.
# See auto-pr.yml for the pattern.

name: Auto-PR create (reusable)

on:
  workflow_call:
    inputs:
      auto_pr_pkg:
        required: false
        type: string
        default: "github:knirski/auto-pr"

permissions: {}

jobs:
  create:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AUTO_PR_PKG: ${{ inputs.auto_pr_pkg }}
    steps:
      - name: Check prerequisites (secrets)
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Missing secrets APP_ID or APP_PRIVATE_KEY. Create a GitHub App and add secrets."
            echo "::error::See https://github.com/knirski/auto-pr/blob/main/docs/INTEGRATION.md"
            exit 1
          fi

      - name: Validate auto_pr_pkg input
        run: |
          TRUSTED_BASE="github:knirski/auto-pr"
          if [ "$AUTO_PR_PKG" != "$TRUSTED_BASE" ] && [[ ! "$AUTO_PR_PKG" == "$TRUSTED_BASE"#* ]]; then
            echo "::error::Invalid auto_pr_pkg input: '$AUTO_PR_PKG'. Must be '$TRUSTED_BASE' or '$TRUSTED_BASE#<ref>' (for testing or version pinning)."
            exit 1
          fi

      - name: Download PR content artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-content
          path: ${{ runner.temp }}/pr-artifact

      # No checkout: workspace has no auto-pr source.
      # Install package with bun add (runs prepare → build); run create-or-update-pr script.
      - name: Setup Bun for create job
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install auto-pr package
        id: install
        env:
          AUTO_PR_PKG: ${{ inputs.auto_pr_pkg }}
        run: |
          mkdir -p "$RUNNER_TEMP/auto-pr-create"
          cd "$RUNNER_TEMP/auto-pr-create"
          bun add "$AUTO_PR_PKG"
          echo "dir=$(pwd)" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create or update PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_WORKSPACE_SAFE: ${{ github.workspace }}
          ARTIFACT_DIR: ${{ runner.temp }}/pr-artifact
          AUTO_PR_DIR: ${{ steps.install.outputs.dir }}
        run: |
          cp "$ARTIFACT_DIR/title.txt" "$GITHUB_WORKSPACE_SAFE/pr-title.txt"
          cp "$ARTIFACT_DIR/body.md" "$GITHUB_WORKSPACE_SAFE/pr-body.md"
          BRANCH=$(cat "$ARTIFACT_DIR/branch.txt")
          export BRANCH
          DEFAULT_BRANCH=$(cat "$ARTIFACT_DIR/default_branch.txt")
          export DEFAULT_BRANCH
          bun run --cwd "$AUTO_PR_DIR/node_modules/auto-pr" create-or-update-pr
