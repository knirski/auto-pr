# Generates a CycloneDX SBOM outside the required PR gate.
# The project is Bun-managed, but npm has the native `sbom` command. This job is
# scheduled/manual so npm peer-resolution differences cannot block dependency PRs.

name: SBOM

on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * *"

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # Exercise Node 24 action compatibility before GitHub makes it the runner default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Generate SBOM
        # --ignore-scripts skips prepare/build; --legacy-peer-deps keeps npm from
        # rejecting Bun-resolved beta peer sets that are still valid for this repo.
        run: npm install --ignore-scripts --legacy-peer-deps && npm sbom --sbom-format cyclonedx > sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
