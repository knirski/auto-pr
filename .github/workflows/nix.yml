# Reusable workflow: Nix build with bun.nix auto-update.
# Called by ci.yml's `nix` job and update-bun-nix.yml.
#
# Uses GitHub App token for trusted same-repo update runs so the push can trigger CI
# on the new commit (GITHUB_TOKEN pushes do not trigger workflows). Dependabot PRs
# do not receive repository secrets, so they run bun.nix as check-only.
#
# Uses upstream Nix (cachix/install-nix-action).
# Builds on x86_64-linux, aarch64-linux, and aarch64-darwin (macos-latest).
# v31+ ships a newer Nix installer (2.34.x) with better macOS dscl behavior; it no-ops if nix is already on PATH.

name: Nix

on:
  workflow_call:
    inputs:
      ref:
        description: "Checkout ref (PR head for ci, omit for default)"
        required: false
        type: string
        default: ""
      push_allowed:
        description: "Whether to commit and push bun.nix updates (false for fork PRs)"
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-nix
  cancel-in-progress: true

permissions: {}

jobs:
  bun-nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      bun_nix_changed: ${{ steps.bun-nix.outputs.changed != '' }}
    steps:
      - name: Generate GitHub App token
        if: inputs.push_allowed && github.actor != 'dependabot[bot]'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ steps.app-token.outputs.token || github.token }}
          fetch-depth: 1

      - name: Setup Nix with cache
        uses: ./.github/actions/setup-nix-with-cache

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update bun.nix
        id: bun-nix
        run: |
          cp bun.nix bun.nix.bak 2>/dev/null || true
          nix run .#update-bun-nix
          if ! diff -q bun.nix.bak bun.nix 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push bun.nix
        if: steps.bun-nix.outputs.changed == 'true' && inputs.push_allowed && github.actor != 'dependabot[bot]'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.nix
          git commit -m "fix(nix): update bun.nix for bun.lock"
          if ! git push; then
            echo "::error::git push failed (exit 128 often = permission denied; check App has Contents: Read and write)"
            exit 1
          fi

      - name: Fail on bun.nix mismatch (check-only)
        if: steps.bun-nix.outputs.changed == 'true' && (!inputs.push_allowed || github.actor == 'dependabot[bot]')
        shell: bash
        run: |
          echo "::error::bun.nix is out of date. This run is check-only and cannot push generated artifacts."
          echo ""
          echo "Update from a trusted branch or run the Update bun.nix workflow:"
          echo "  nix run .#update-bun-nix"
          echo "  git add bun.nix && git commit -m 'fix(nix): update bun.nix for bun.lock'"
          exit 1

  build:
    needs: bun-nix
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      # codeql[actions/untrusted-checkout] build job has contents: read only; callers use
      # pull_request (not pull_request_target) and gate push_allowed for forks.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Nix with cache
        uses: ./.github/actions/setup-nix-with-cache

      - name: Nix flake check
        run: nix flake check -L --system ${{ matrix.system }}
