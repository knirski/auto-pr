# Auto-PR — uses two reusable workflows (generate + create). Push to ai/* to auto-create a PR.
# No package.json required. Run: npx -p github:knirski/auto-pr auto-pr-init (creates this file, template, .nvmrc)
#
# Two workflows: generate (unprivileged, checkout branch) + create (privileged, checkout default).
# Satisfies CodeQL "untrusted checkout in trusted context" — no suppression.
#
# Runs on forks too: add APP_ID/APP_PRIVATE_KEY to your fork to test; else fails with clear message.
#
# Reusable workflow refs: use @<branch> while developing (resolves to branch tip). After merge to main,
# pin both lines to the merge commit SHA (same as update-workflow-pins / INTEGRATION).
# Composite actions in generate + check: use @<branch> while developing; pin to merge SHA on main after merge.

name: Auto-PR

permissions: {}

on:
  push:
    branches:
      - "ai/**"

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.ref_name != github.event.repository.default_branch
    permissions:
      contents: read
      models: read # required for reusable generate job (GitHub Models); caller caps nested permissions
    uses: knirski/auto-pr/.github/workflows/auto-pr-generate-reusable.yml@e266233b1959a30a118e777d2a309d38ce2296b6
    secrets:
      # GitHub API token for the generate job. This workflow grants `models: read` so the default
      # `github.token` works. If you use a PAT, set repo secret `GH_TOKEN` and pass
      # `${{ secrets.GH_TOKEN || github.token }}` here instead.
      GH_TOKEN: ${{ github.token }}

  create:
    needs: generate
    permissions:
      contents: read
      pull-requests: write
    uses: knirski/auto-pr/.github/workflows/auto-pr-create-reusable.yml@e266233b1959a30a118e777d2a309d38ce2296b6
    with:
      auto_pr_pkg: ${{ needs.generate.outputs.auto_pr_pkg }}
    secrets: inherit
