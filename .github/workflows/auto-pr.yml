# Auto-PR — uses two reusable workflows (generate + create). Push to ai/** to auto-create a PR.
# No package.json required. Run: npx -p github:knirski/auto-pr auto-pr-init (creates this file, template, .nvmrc)
#
# Two workflows: generate (unprivileged, checkout branch) + create (privileged, checkout default).
# Satisfies CodeQL "untrusted checkout in trusted context" — no suppression.
#
# Runs on forks too: add APP_ID/APP_PRIVATE_KEY to your fork to test; else fails with clear message.
#
# Reusable workflow refs: always use a commit SHA — branch name refs do not resolve reliably for same-repo
# reusable workflows. Update both SHA pins to the current HEAD after each push. After merge to main,
# pin to the merge commit SHA (same as update-workflow-pins / INTEGRATION).
# Composite actions in generate + check: same rule — always pin to a SHA, never a branch name.

name: Auto-PR

permissions: {}

on:
  push:
    branches:
      - "ai/**"

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.ref_name != github.event.repository.default_branch
    # timeout-minutes not settable on reusable-call jobs; auto-pr-generate-reusable caps generate at 25m
    permissions:
      contents: read
      pull-requests: read # caps reusable generate job (gh pr view for existing title)
      models: read # required for reusable generate job (GitHub Models); caller caps nested permissions
    uses: knirski/auto-pr/.github/workflows/auto-pr-generate-reusable.yml@013413e6a9f9ae377e5f004c447f4c30bc248331
    secrets:
      # GitHub API token for the generate job. This workflow grants `models: read` so the default
      # `github.token` works. If you use a PAT, set repo secret `GH_TOKEN` and pass
      # `${{ secrets.GH_TOKEN || github.token }}` here instead.
      GH_TOKEN: ${{ github.token }}

  create:
    needs: generate
    # timeout-minutes not settable on reusable-call jobs; auto-pr-create-reusable caps create at 5m
    permissions:
      contents: read
      pull-requests: write
    uses: knirski/auto-pr/.github/workflows/auto-pr-create-reusable.yml@013413e6a9f9ae377e5f004c447f4c30bc248331
    with:
      auto_pr_pkg: ${{ needs.generate.outputs.auto_pr_pkg }}
    secrets: inherit
