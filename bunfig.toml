logLevel = "warn"

[install]
exact = true

[test]
# HTTP integration tests: run via `bun run test:integration` (bunfig.integration.toml).
pathIgnorePatterns = ["test/integration/**"]
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
# act-local-ci.ts: CLI + process I/O; per-file coverage still misses most branches. Pure logic: src/core/act-local-ci.ts; program dry-run path: test/scripts/act-local-ci.test.ts.
coveragePathIgnorePatterns = ["test/**", "**/core/errors.ts", "scripts/act-local-ci.ts"]
coverageSkipTestFiles = true
# Bun enforces per-file threshold on both % funcs and % lines. Floor was 0.68 (weakest line ~68%).
# Raised to 0.75: still below auto-pr-init (75% funcs) and collapse-prose (~84% lines).
coverageThreshold = 0.75
concurrentTestGlob = "test/**/*.test.ts"
preload = ["./test/test-setup.ts"]
smol = true
timeout = 15000

[test.reporter]
junit = "test-report.junit.xml"
