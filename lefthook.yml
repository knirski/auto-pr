# Git hooks via Lefthook. See https://lefthook.dev/

pre-commit:
  jobs:
    - run: scripts/check-no-dist-staged.sh
    - glob:
        - ".github/**/*.yml"
        - ".github/**/*.sh"
        - "scripts/smoke-update-pins-check-only.sh"
      run: bash scripts/smoke-update-pins-check-only.sh
    - run: bun x lint-staged
    - glob: "*.nix"
      run: bun run check:nix

commit-msg:
  jobs:
    - run: bun x --bun commitlint --edit {1}

pre-push:
  jobs:
    - run: bun run check:code
