# Git hooks via Lefthook. See https://lefthook.dev/

pre-commit:
  jobs:
    - run: scripts/check-no-dist-staged.sh
    - run: bun x lint-staged
    - glob: "*.nix"
      run: bun run check:nix

commit-msg:
  jobs:
    - run: bun x --bun commitlint --edit {1}

pre-push:
  jobs:
    # Unset git hook env vars (GIT_DIR etc.) so integration tests that spawn
    # git subprocesses operate on their isolated temp repos, not this repo.
    - run: unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR; bun run check:code
