# Git hooks via Lefthook. See https://lefthook.dev/

pre-commit:
  jobs:
    - run: |
        if git diff --cached --name-only --diff-filter=ACMR | grep -q '^dist/'; then
          echo "Error: dist/ must not be committed."
          echo "Unstage with: git reset HEAD dist/"
          exit 1
        fi
    - run: bun x lint-staged
    - glob: "*.nix"
      run: bun run check:nix

commit-msg:
  jobs:
    - run: bun x --bun commitlint --edit {1}

pre-push:
  jobs:
    - run: bun run check:code
